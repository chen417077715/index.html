<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>癞子斗地主</title>
  <style>
    :root{--green:#12643a;--gold:#ffd166;--panel:#073a27;--ink:#20170f}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Microsoft Yahei",sans-serif;background:radial-gradient(circle at 50% 30%,#198653,#0d4c31 70%);color:#fff;min-height:100vh;overflow:hidden}button{font:inherit}.app{position:relative;height:100vh;min-height:620px}.topbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#082d20cc}.title{font-weight:800}.top-actions{display:flex;gap:8px}.top-actions button,.action-btn{border:0;border-radius:8px;padding8px 12px;background:#f7f1df;color:var(--ink);font-weight:700}.table{position:absolute;inset:54px 0 0}.hand{position:absolute;display:flex;align-items:flex-end;justify-content:center}.bottom{left:10%;right:10%;bottom:12px;height:170px}.top{top:18px;left:27%;right:27%;height:105px}.left{left:10px;top:145px;bottom:180px;width:145px;transform-origin:left center}.right{right:10px;top:145px;bottom:180px;width:145px}.cards{display:flex;justify-content:center}.card{width:74px;height:104px;margin-left:-25px;border:2px solid #ded7c8;border-radius:9px;background:#fffdf7;color:#222;box-shadow:0 5px 12px #0005;display:flex;flex-direction:column;padding:7px;position:relative;cursor:pointer;transition:.15s;user-select:none}.card:first-child{margin-left:0}.card.red{color:#d53131}.card.selected{transform:translateY(-22px);border-color:#ffd166;box-shadow:0 0 0 3px #ffd16655}.card.joker{background:linear-gradient(135deg,#fff9ea,#e8d18c)}.card .rank{font-size:21px;font-weight:900}.card .suit{font-size:26px}.card-back{width:58px;height:82px;border:4px solid #f6eddb;border-radius:7px;background:repeating-linear-gradient(45deg,#bb3030 0 5px,#df6565 5px 10px);box-shadow:0 4px 8px #0004;margin-left:-32px}.top .card-back,.bottom .card-back{width:54px;height:76px}.player{position:absolute;text-align:center}.bottom-player{bottom:184px;left:50%;transform:translateX(-50%)}.top-player{top:130px;left:50%;transform:translateX(-50%)}.left-player{left:12px;top:48%}.right-player{right:12px;top:48%}.avatar{width:58px;height:58px;border-radius:50%;border:3px solid #fff5;background:#d99b5b;display:flex;align-items:center;justify-content:center;font-size:24px}.count{margin-top:4px;background:#071f17aa;border-radius:12px;padding3px 8px;font-weight:800}.landlord{position:absolute;right:-8px;top:-8px;width:24px;height:24px;border-radius:50%;background:#ffd166;color:#7a2c00;font-size:13px;display:flex;align-items:center;justify-content:center}.play-area{position:absolute;left:22%;right:22%;top:260px;bottom:210px;display:flex;align-items:center;justify-content:center}.controls{position:absolute;left:50%;bottom:184px;transform:translateX(-50%);display:flex;gap:10px}.action-btn.primary{background:#ffd166}.action-btn:disabled{opacity:.45}.pile{display:flex;justify-content:center}.pile .card{width:58px;height:82px;margin-left:-23px}.pile .rank{font-size:17px}.pile .suit{font-size:20px}.message{position:absolute;left:50%;top:205px;transform:translateX(-50%);background:#082d20cc;border-radius:20px;padding:7px 14px;font-weight:800}.landlord-panel{position:absolute;left:50%;top:115px;transform:translateX(-50%);width:520px;background:#06271b;border-radius:14px;padding:14px;text-align:center;z-index:20}.bid-options{display:flex;justify-content:center;gap:8px;margin-top10px}.bid-options button{border:0;border-radius8px;padding9px 14px;font-weight800}.bid-options .yes{background:#ffd166}.modal{position:absolute;inset:0;background:#0009;z-index:50;display:none;align-items:center;justify-content:center}.modal.show{display:flex}.modal-card{width:min(520px,calc(100% - 30px));background:#fffdf5;color:#222;border-radius16px;padding20px}.modal-card h2{margin-top:0}.modal-card .row{display:flex;gap8px;margin:12px 0}.modal-card input{flex:1;border:1px solid #bbb;border-radius8px;padding10px}.modal-card button{border:0;border-radius8px;padding10px 14px;font-weight800;background:#ffd166}.rules{line-height:1.7}.hidden{display:none!important}@media(max-width:700px){.left,.right{width:90px}.left-player{left:4px}.right-player{right:4px}.bottom{left:2%;right:2%}.top{left:20%;right:20%}.card{width:61px;height:87px;margin-left:-25px}.bottom-player{bottom:160px}.controls{bottom:160px}.play-area{top:220px;bottom:180px}.avatar{width:48px;height:48px}.landlord-panel{width:calc(100% - 24px)}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="title">♠ 癞子斗地主 · 四人局</div><div class="top-actions"><button id="inviteBtn">邀请朋友</button><button id="rulesBtn">规则</button><button id="newBtn">新局</button></div></header>
  <main class="table">
    <div class="hand top" id="handTop"></div><div class="hand left" id="handLeft"></div><div class="hand right" id="handRight"></div><div class="hand bottom" id="handBottom"></div>
    <div class="player top-player" id="playerTop"><div class="avatar">南</div><div class="count" id="countTop">0张</div></div>
    <div class="player left-player" id="playerLeft"><div class="avatar">西</div><div class="count" id="countLeft">0张</div></div>
    <div class="player right-player" id="playerRight"><div class="avatar">东</div><div class="count" id="countRight">0张</div></div>
    <div class="player bottom-player" id="playerBottom"><div class="avatar">北</div><div class="count" id="countBottom">0张</div></div>
    <div class="landlord-panel hidden" id="bidPanel"><b>是否抢地主？</b><div class="bid-options"><button class="yes" id="bidYes">抢地主</button><button id="bidNo">不抢</button></div></div>
    <div class="message" id="message">准备开始</div>
    <div class="play-area"><div class="pile" id="pile"></div></div>
    <div class="controls hidden" id="controls"><button class="action-btn" id="passBtn">不出</button><button class="action-btn primary" id="playBtn">出牌</button><button class="action-btn" id="hintBtn">提示</button></div>
  </main>
</div>
<div class="modal" id="rulesModal"><div class="modal-card"><h2>游戏规则</h2><div class="rules">从54张牌中去除两张 <b>2</b>，再加入一张配牌；配牌、大小王作为癞子，可当作任意牌。地主拥有5张底牌，四人轮流出牌。顺子最少4张，连队最少2连，炸弹最少3张且不能超过4张；3张炸弹配癞子可组成4张炸弹；禁止3带1。</div><button class="modal-close">知道了</button></div></div>
<div class="modal" id="inviteModal"><div class="modal-card"><h2>邀请朋友</h2><p>复制下方房间链接发给朋友。</p><div class="row"><input id="roomLink" readonly /><button id="copyLink">复制</button></div><button class="modal-close">关闭</button></div></div>
<script>
const SUITS=['♠','♥','♣','♦'];
let deck=[], hands=[[],[],[],[]], landlord=-1, turn=0, current=null, selected=new Set(), phase='deal', bids=[];
const els={};['handTop','handLeft','handRight','handBottom','countTop','countLeft','countRight','countBottom','pile','message','controls','bidPanel','bidYes','bidNo','playBtn','passBtn','hintBtn','rulesModal','inviteModal','roomLink'].forEach(id=>els[id]=document.getElementById(id));
function makeDeck(){let d=[];SUITS.forEach(s=>{for(let r=3;r<=14;r++){if(r===15)continue;if(r===13||r===14||r===11||r===12){} if(r!==15)d.push({rank:r,suit:s,id:s+r,wild:false});}});let ranks=[];SUITS.forEach(s=>{for(let r=3;r<=14;r++){ranks.push({rank:r,suit:s,id:s+r,wild:false})}});ranks=ranks.filter(c=>c.rank!==15&&c.rank!==2);ranks.push({rank:16,suit:'',id:'joker-b',wild:true,name:'小王'});ranks.push({rank:17,suit:'',id:'joker-r',wild:true,name:'大王'});ranks.push({rank:99,suit:'★',id:'wild-card',wild:true,name:'配牌'});return ranks}
function rankName(r){return ({3:'3',4:'4',5:'5',6:'6',7:'7',8:'8',9:'9',10:'10',11:'J',12:'Q',13:'K',14:'A',16:'小王',17:'大王',99:'配'})[r]||r}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function deal(){deck=shuffle(makeDeck());hands=[[],[],[],[]];for(let i=0;i<48;i++)hands[i%4].push(deck[i]);hands.forEach(h=>h.sort(compare));landlord=-1;turn=0;current=null;selected.clear();bids=[];phase='bid';els.bidPanel.classList.remove('hidden');els.controls.classList.add('hidden');els.message.textContent='开始抢地主';render(); }
function compare(a,b){let ra=a.rank===99?18:a.rank;let rb=b.rank===99?18:b.rank;return ra-rb||a.id.localeCompare(b.id)}
function cardHTML(c,small=false,face=true){if(!face)return '<div class="card-back"></div>';let cls=c.suit==='♥'||c.suit==='♦'||c.suit==='★'?'red':'';if(c.wild)cls+=' joker';let top=c.name||rankName(c.rank);return `<div class="card ${cls}" data-id="${c.id}" title="${top}"><span class="rank">${top}</span><span class="suit">${c.suit||'♟'}</span></div>`}
function render(){for(let i=0;i<4;i++){let el=els[['handBottom','handTop','handRight','handLeft'][i]],cnt=[0,0,0,0];cnt[i]=hands[i].length;els[['countBottom','countTop','countRight','countLeft'][i]].textContent=hands[i].length+'张';if(i===0)el.innerHTML=hands[i].map(c=>cardHTML(c)).join('');else el.innerHTML=Array.from({length:Math.min(hands[i].length,12)},()=>'<div class="card-back"></div>').join('')}els.handBottom.querySelectorAll('.card').forEach(el=>el.onclick=()=>{let id=el.dataset.id;if(selected.has(id)){selected.delete(id);el.classList.remove('selected')}else{selected.add(id);el.classList.add('selected')}});els.pile.innerHTML=current?current.cards.map(c=>cardHTML(c)).join(''):'';document.querySelectorAll('.landlord').forEach(x=>x.remove());if(landlord>=0){let map=['playerBottom','playerTop','playerRight','playerLeft'];let player=document.getElementById(map[landlord]);let badge=document.createElement('span');badge.className='landlord';badge.textContent='地';player.appendChild(badge)}let names=['北','南','东','西'];els.message.textContent=phase==='bid'?names[turn]+'抢地主中':(turn===0?'轮到你出牌':names[turn]+'出牌中');}
function selectedCards(){return hands[0].filter(c=>selected.has(c.id))}
function countRanks(cards){let m={};cards.forEach(c=>{let r=c.rank===99?18:c.rank;m[r]=(m[r]||0)+1});return m}
function analyze(cards){if(!cards.length)return null;let wild=cards.filter(c=>c.wild);let normal=cards.filter(c=>!c.wild);if(cards.length===1)return {type:'single',len:1,rank:cards[0].rank===99?18:cards[0].rank,cards};if(cards.length===2&&!wild.length&&normal[0].rank===normal[1].rank)return {type:'pair',len:2,rank:normal[0].rank,cards};if(cards.length>=3&&cards.length<=4&&normal.every(c=>c.rank===normal[0].rank)&&(!wild.length||cards.length<=4))return {type:'bomb',len:cards.length,rank:normal[0]?.rank||99,cards};let nums=cards.map(c=>c.rank===99?null:c.rank).filter(x=>x!=null);let k=cards.length-wild.length;if(k===0)return null;let m={};nums.forEach(r=>m[r]=(m[r]||0)+1);let vals=Object.keys(m).map(Number);let len=cards.length;let isStraight=vals.length===len&&Math.max(...vals)-Math.min(...vals)+1===len&&Math.min(...vals)>=3&&Math.max(...vals)<=14;if(isStraight&&wild.length===0)return {type:'straight',len,rank:Math.max(...vals),cards};let pairvals=vals.filter(r=>m[r]===2);if(cards.length>=4&&cards.length%2===0&&pairvals.length===cards.length/2&&Math.max(...pairvals)-Math.min(...pairvals)+1===pairvals.length&&Math.min(...pairvals)>=3&&Math.max(...pairvals)<=14)return {type:'consecutive_pairs',len:cards.length/2,rank:Math.max(...pairvals),cards};return null}
function canBeat(a,b){if(!a||!b)return false;if(a.type==='bomb'&&b.type==='bomb'&&a.len<=4&&b.len<=4)return a.len>b.len||(a.len===b.len&&a.rank>b.rank);if(a.type===b.type&&a.len===b.len&&a.rank>b.rank){if(a.type==='bomb'&&a.len>4)return false;return true}return false}
function playSelected(){if(turn!==0||phase!=='play')return;let cs=selectedCards();let a=analyze(cs);if(!a){els.message.textContent='不符合牌型（顺子至少4张、连队至少2连）';return}if(a.type==='bomb'&&a.len>4){els.message.textContent='不能出现超过4张的炸弹';return}if(current&&(!canBeat(a,current))){els.message.textContent='压不过上家';return}hands[0]=hands[0].filter(c=>!selected.has(c.id));selected.clear();current={...a,cards:cs};turn=(turn+1)%4;if(hands[0].length===0){endGame(0);return}render();els.controls.classList.add('hidden');setTimeout(aiTurn,700)}
function hint(){let h=hands[0];for(let i=0;i<h.length;i++)for(let j=i;j<h.length;j++){let cs=h.slice(i,j+1);let a=analyze(cs);if(a&&(!current||canBeat(a,current))){selected.clear();cs.forEach(c=>selected.add(c.id));render();return}}els.message.textContent='没有能出的牌';}
function aiTurn(){if(phase!=='play'||turn===0)return;let h=hands[turn];let combos=makeAIMoves(h);let move=null;if(!current)move=combos.find(x=>x.type!=='bomb')||combos[0];else move=combos.find(a=>canBeat(a,current));if(move){hands[turn]=hands[turn].filter(c=>!move.cards.includes(c));current={...move,cards:[...move.cards]}}else els.message.textContent=['北','南','东','西'][turn]+'不出';if(hands[turn].length===0){endGame(turn);return}turn=(turn+1)%4;render();if(turn===0&&phase==='play')els.controls.classList.remove('hidden');else setTimeout(aiTurn,700)}
function makeAIMoves(h){let out=[];for(let c of h){out.push(analyze([c]))}let m=countRanks(h);for(let r in m)if(m[r]>=2)for(let c of h.filter(c=>c.rank==r) .slice(0,2)){}for(let i=0;i<h.length;i++)for(let j=i;j<h.length;j++){let cs=h.slice(i,j+1);let a=analyze(cs);if(a&&a.len<=4)out.push(a)}return out.filter(x=>x)}
function endGame(winner){phase='end';els.controls.classList.add('hidden');els.bidPanel.classList.add('hidden');els.message.textContent=(winner===landlord?'地主':'农民')+'获胜！';}
function bid(){bids.push(true);landlord=turn;els.bidPanel.classList.add('hidden');let bottom=deck.splice(48,5);hands[landlord].push(...bottom);hands[landlord].sort(compare);phase='play';turn=landlord;els.message.textContent='地主已确定，发放5张底牌';render();if(turn!==0)setTimeout(aiTurn,900);else els.controls.classList.remove('hidden')}
function pass(){if(turn!==0||phase!=='play')return;if(!current){els.message.textContent='必须出牌';return}selected.clear();turn=(turn+1)%4;render();els.controls.classList.add('hidden');setTimeout(aiTurn,700)}
 els.bidYes.onclick=()=>{bid()};els.bidNo.onclick=()=>{bids.push(false);turn=(turn+1)%4;if(turn===0&&bids.length>=4){landlord=0;els.bidPanel.classList.add('hidden');phase='play';let bottom=deck.splice(48,5);hands[0].push(...bottom);hands[0].sort(compare);render();els.controls.classList.remove('hidden')}else if(turn===0){els.bidPanel.classList.remove('hidden');els.message.textContent='重新抢地主'}else els.message.textContent=['北','南','东','西'][turn]+'抢地主中'};els.playBtn.onclick=playSelected;els.passBtn.onclick=pass;els.hintBtn.onclick=hint;document.getElementById('newBtn').onclick=deal;document.getElementById('rulesBtn').onclick=()=>els.rulesModal.classList.add('show');document.getElementById('inviteBtn').onclick=()=>{let url=location.href.split('#')[0]+'#room='+Math.random().toString(36).slice(2,8);els.roomLink.value=url;els.inviteModal.classList.add('show')};document.querySelectorAll('.modal-close').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('show'));document.getElementById('copyLink').onclick=()=>navigator.clipboard?.writeText(els.roomLink.value);
deal();
</script>
</body>
</html>
